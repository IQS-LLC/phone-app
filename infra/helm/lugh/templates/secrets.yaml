# =============================================================================
# Lugh Secrets
# Do NOT commit real values. Populate via:
#   kubectl create secret generic lugh-secrets -n lugh \
#     --from-literal=SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(50))") \
#     --from-literal=DB_PASSWORD=$(openssl rand -base64 32) \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -base64 32)
#
# Or use Helm with --set-string and a values-secret.yaml (never committed).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: lugh-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "lugh.labels" . | nindent 4 }}
type: Opaque
stringData:
  # These are placeholder values — replace via kubectl or external secrets manager
  SECRET_KEY: "CHANGE-ME-generate-with-python-secrets-token-urlsafe-50"
  DB_PASSWORD: "CHANGE-ME-secure-database-password"
  POSTGRES_PASSWORD: "CHANGE-ME-secure-database-password"
  # Optional: API key for inter-service communication
  INTERNAL_API_KEY: "CHANGE-ME-internal-api-key"
