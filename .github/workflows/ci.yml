name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Django Tests
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Django tests
      run: |
        python manage.py test
    - name: Run Django checks
      run: |
        python manage.py check
        python manage.py makemigrations --check

    # Flutter Tests
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
    - name: Install Flutter dependencies
      working-directory: flutter_application_plc
      run: flutter pub get
    - name: Run Flutter tests
      working-directory: flutter_application_plc
      run: flutter test

    # Build Single Container
    - name: Build Docker image
      run: docker build -f Dockerfile.single -t plc-project:latest .

    # Push to Registry (optional)
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        docker tag plc-project:latest ${{ secrets.DOCKER_USERNAME }}/plc-project:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/plc-project:latest

  build-mobile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
    - name: Build Android APK
      working-directory: flutter_application_plc
      run: |
        flutter pub get
        flutter build apk --release
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: flutter_application_plc/build/app/outputs/flutter-apk/app-release.apk

  build-mobile-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
    - name: Build iOS
      working-directory: flutter_application_plc
      run: |
        flutter pub get
        flutter build ios --release --no-codesign
    - name: Upload iOS build
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: flutter_application_plc/build/ios/iphoneos/Runner.app

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-and-build, build-mobile]
    steps:
    - name: Deploy to server
      run: |
        echo "Deployment would happen here"
        echo "Use SSH to connect to your server and run auto_deploy.sh"
        # Example deployment command:
        # ssh user@server "cd /path/to/project && ./auto_deploy.sh"