# =============================================================================
# Lugh — Production CI/CD
# =============================================================================
#
# Flow
# ────
#  push to main / AI-ed branch
#    1. test          Django tests against real Postgres
#    2. build         Django image → docker.io/<DOCKERHUB_USERNAME>/lugh-django
#    3. android       Signed release APK uploaded as artifact
#    4. ios           Unsigned IPA uploaded as artifact (sideload via AltStore/Sideloadly)
#    5. deploy        Pull + restart on NAS (when DEPLOY_ENABLED=true)
#
#  push a tag  v*.*.*
#    All of the above, PLUS:
#    6. release       GitHub Release created; APK + IPA attached
#
# Required GitHub Secrets
# ────────────────────────
#  DOCKERHUB_USERNAME     Your Docker Hub handle (e.g. shara-a)
#  DOCKERHUB_TOKEN        Docker Hub access token (Settings → Security → New Token)
#  LUGH_SERVER_URL        Set automatically by gogogo222.ps1 each run
#  DJANGO_SECRET_KEY      Django SECRET_KEY for production
#  DB_PASSWORD            PostgreSQL password
#  ANDROID_KEYSTORE_B64   base64-encoded release keystore (.jks)
#  ANDROID_STORE_PASSWORD Keystore password
#  ANDROID_KEY_ALIAS      Key alias inside the keystore
#  ANDROID_KEY_PASSWORD   Key password
#
# One-time Docker Hub setup
# ──────────────────────────
#  1. hub.docker.com → Create Repository
#     Name: lugh-django   Visibility: Public   → Create
#  2. hub.docker.com → Account Settings → Security → New Access Token
#     Name: github-actions   Permissions: Read & Write
#     Copy the token → add as DOCKERHUB_TOKEN secret in GitHub
#  3. Add DOCKERHUB_USERNAME secret = your Docker Hub handle
#
# One-time server setup (run once manually, then CI takes over)
# ─────────────────────
#  # Install k3s
#  curl -sfL https://get.k3s.io | sh -
#
#  # Install Helm
#  curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
#
#  # Create namespace + secrets (NEVER put real values in this file)
#  kubectl create namespace lugh
#  kubectl create secret generic lugh-secrets -n lugh \
#    --from-literal=SECRET_KEY='<generate with python -c "import secrets; print(secrets.token_urlsafe(50))">' \
#    --from-literal=DB_PASSWORD='<strong-password>' \
#    --from-literal=POSTGRES_PASSWORD='<same-strong-password>' \
#    --from-literal=INTERNAL_API_KEY='<random>'
#
#  # Add the Beckhoff AMS route (on the PLC side — TwinCAT System Manager)
#  # Add a static route entry pointing to 192.168.0.192 (server IP)
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, AI-ed]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  DJANGO_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lugh-django

# ─────────────────────────────────────────────────────────────────────────────
# 1. Tests
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       test_db
          POSTGRES_USER:     test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check migrations are up to date
        env:
          DJANGO_SETTINGS_MODULE: PLC_Project.settings
          SECRET_KEY: ci-test-key
          DB_ENGINE:   django.db.backends.postgresql
          DB_NAME:     test_db
          DB_USER:     test_user
          DB_PASSWORD: test_pass
          DB_HOST:     localhost
          DB_PORT:     "5432"
          PLC_MOCK:    "true"
          DEBUG:       "true"
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations + tests
        env:
          DJANGO_SETTINGS_MODULE: PLC_Project.settings
          SECRET_KEY: ci-test-key
          DB_ENGINE:   django.db.backends.postgresql
          DB_NAME:     test_db
          DB_USER:     test_user
          DB_PASSWORD: test_pass
          DB_HOST:     localhost
          DB_PORT:     "5432"
          PLC_MOCK:    "true"
          DEBUG:       "true"
        run: |
          python manage.py migrate --noinput
          python manage.py test --verbosity=2

# ─────────────────────────────────────────────────────────────────────────────
# 2. Build & Push Django Docker image → GHCR
# ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build Django Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-sha: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DJANGO_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

# ─────────────────────────────────────────────────────────────────────────────
# 3. Build signed Android APK
# ─────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.x"
          cache: true

      - name: Flutter pub get
        working-directory: flutter_application_plc
        run: flutter pub get

      # Decode keystore + write key.properties
      # Uses shell `if` on env vars — build.gradle.kts falls back to debug
      # signing automatically when no keystore is present.
      - name: Setup Android signing
        env:
          KEYSTORE_B64:   ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS:  ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:       ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # app/build.gradle.kts resolves storeFile relative to android/app/
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode \
              > flutter_application_plc/android/app/lugh-release.jks
            # key.properties lives in android/ (rootProject.file("key.properties"))
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "lugh-release.jks" "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEY_PASS" \
              > flutter_application_plc/android/key.properties
            echo "Release signing configured"
          else
            echo "ANDROID_KEYSTORE_B64 not set — APK will use debug signing"
          fi

      - name: Build release APK
        working-directory: flutter_application_plc
        run: |
          flutter build apk --release \
            --dart-define="LUGH_SERVER_URL=${{ secrets.LUGH_SERVER_URL }}" \
            --build-name="${{ github.ref_name }}" \
            --build-number="${{ github.run_number }}"

      - name: Rename APK with version
        run: |
          VERSION="${{ github.ref_name }}"
          cp flutter_application_plc/build/app/outputs/flutter-apk/app-release.apk \
             lugh-android-${VERSION}-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: lugh-android-apk
          path: lugh-android-*.apk
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# 4. Build iOS IPA (macOS runner — Xcode required)
# ─────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.x"
          cache: true

      - name: Flutter pub get
        working-directory: flutter_application_plc
        run: flutter pub get

      - name: Build iOS (no-codesign — works without Apple dev account)
        working-directory: flutter_application_plc
        run: |
          flutter build ios --release --no-codesign \
            --dart-define="LUGH_SERVER_URL=${{ secrets.LUGH_SERVER_URL }}" \
            --build-name="${{ github.ref_name }}" \
            --build-number="${{ github.run_number }}"

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r flutter_application_plc/build/ios/iphoneos/Runner.app Payload/
          zip -r lugh-ios-${{ github.ref_name }}-${{ github.run_number }}.ipa Payload/
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: lugh-ios-ipa
          path: lugh-ios-*.ipa
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# 5. Deploy — runs directly on Synology NAS via self-hosted runner
#    Runner container has /volume1/docker/lugh and /var/run/docker.sock mounted.
#    No SSH needed — we ARE the server.
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, synology]
    needs: [build-backend, build-android, build-ios]
    # Only runs when DEPLOY_ENABLED repo variable = 'true' AND NAS runner is online.
    # Set it: GitHub repo → Settings → Variables → DEPLOY_ENABLED = true
    # Leave unset (or 'false') when running local-PC mode — job skips instantly.
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Write/update .env
        env:
          SECRET_KEY:  ${{ secrets.DJANGO_SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p /volume1/docker/lugh/postgres_data \
                   /volume1/docker/lugh/redis_data \
                   /volume1/docker/lugh/static \
                   /volume1/docker/lugh/media
          printf 'SECRET_KEY=%s\nPOSTGRES_PASSWORD=%s\nDB_PASSWORD=%s\n' \
            "$SECRET_KEY" "$DB_PASSWORD" "$DB_PASSWORD" \
            > /volume1/docker/lugh/.env
          chmod 600 /volume1/docker/lugh/.env
          echo ".env written"

      - name: Copy compose file + nginx config
        run: |
          cp docker-compose.prod.yml /volume1/docker/lugh/docker-compose.prod.yml
          cp nginx/nginx.conf        /volume1/docker/lugh/nginx.conf

      - name: Pull new image + recreate stack
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          COMPOSE_FILE=/volume1/docker/lugh/docker-compose.prod.yml
          DJANGO_IMAGE="${DOCKERHUB_USERNAME}/lugh-django:latest"

          # Requires the self-hosted runner OS user to be in the 'docker' group:
          #   sudo usermod -aG docker <runner-user> && newgrp docker
          # Do NOT chmod 666 /var/run/docker.sock — that grants any local process
          # full Docker daemon control (container escape, host access).

          echo "==> Pulling new django image (public Docker Hub — no login needed)"
          docker pull "$DJANGO_IMAGE"

          echo "==> Starting / updating stack"
          docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

          echo "==> Waiting for Django to be healthy (up to 90s)"
          for i in $(seq 1 18); do
            STATUS=$(docker inspect lugh_django --format '{{.State.Health.Status}}' 2>/dev/null || echo "missing")
            echo "  [$i/18] Django health: $STATUS"
            [ "$STATUS" = "healthy" ] && break
            [ $i -eq 18 ] && echo "Timed out" && docker compose -f "$COMPOSE_FILE" logs django | tail -30 && exit 1
            sleep 5
          done

          echo "==> Stack status"
          docker compose -f "$COMPOSE_FILE" ps
          echo "==> Deploy complete"

      - name: Health check
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          # Runner is inside Docker — reach the host via its LAN IP, not localhost
          curl -sf "http://$HOST:9080/health/" && echo 'Health check PASSED'

# ─────────────────────────────────────────────────────────────────────────────
# 5. GitHub Release (only on version tags  v*.*.*)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]   # deploy is optional — release APK+IPA regardless
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: lugh-android-apk

      - name: Download IPA artifact
        uses: actions/download-artifact@v5
        with:
          name: lugh-ios-ipa

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lugh ${{ github.ref_name }}"
          body: |
            ## Lugh ${{ github.ref_name }}

            ### Android — direct install
            1. Download `lugh-android-*.apk`
            2. Transfer to Android device
            3. Enable "Install from unknown sources" in Settings → Security
            4. Tap the APK to install

            ### iOS — sideload (no App Store)
            1. Download `lugh-ios-*.ipa`
            2. Use **AltStore** or **Sideloadly** to install on your iPhone
            3. Trust the developer certificate in Settings → General → VPN & Device Management

            ### Server
            - API: `http://192.168.0.192:9080`
            - Health: `http://192.168.0.192:9080/health/`
          draft: false
          prerelease: false
          files: |
            lugh-android-*.apk
            lugh-ios-*.ipa
