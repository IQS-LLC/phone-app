# Lugh Platform — Full development stack
# Includes: PostgreSQL, Redis, Django, Celery Worker, Celery Beat, Nginx
# No mock PLC — every apartment connects to the real CX over ADS.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml down -v   # destroy volumes too
#
services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: lugh_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       lugh_db
      POSTGRES_USER:     lugh_user
      POSTGRES_PASSWORD: lugh_dev_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lugh_net
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U lugh_user -d lugh_db"]
      interval: 5s
      timeout:  5s
      retries:  10
    ports:
      - "5432:5432"

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lugh_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - lugh_net
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  10
    ports:
      - "6379:6379"

  # ── Django (dev — auto-reload, SQLite-level DEBUG) ───────────────────────────
  django:
    build:
      context: .
      target:  production
    container_name: lugh_django
    restart: unless-stopped
    user: root
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: PLC_Project.settings
    command: >
      sh -c "
        mkdir -p /app/static /app/media /app/logs &&
        python manage.py migrate --noinput &&
        python manage.py seed_demo --noinput 2>/dev/null || true &&
        python manage.py collectstatic --noinput &&
        gunicorn --config gunicorn.conf.py PLC_Project.wsgi:application
      "
    volumes:
      - static_vol:/app/static
      - media_vol:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lugh_net
    healthcheck:
      test:     ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""]
      interval: 15s
      timeout:  10s
      start_period: 30s
      retries:  5
    ports:
      - "8000:8000"

  # ── Celery Worker ────────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      target:  production
    container_name: lugh_celery_worker
    restart: unless-stopped
    user: root
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: PLC_Project.settings
    command: >
      celery -A PLC_Project worker
        --loglevel=info
        -Q plc,alarms,notifications,housekeeping
        --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lugh_net
    healthcheck:
      test:     ["CMD-SHELL", "celery -A PLC_Project inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout:  10s
      start_period: 20s
      retries:  3

  # ── Celery Beat (singleton — exactly one replica) ────────────────────────────
  celery-beat:
    build:
      context: .
      target:  production
    container_name: lugh_celery_beat
    restart: unless-stopped
    user: root
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: PLC_Project.settings
    command: >
      celery -A PLC_Project beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
        --pidfile=/tmp/celerybeat.pid
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lugh_net
    healthcheck:
      test:     ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) 2>/dev/null"]
      interval: 30s
      timeout:  5s
      start_period: 15s
      retries:  3

  # ── Nginx (reverse proxy + static files) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lugh_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_vol:/app/static:ro
      - media_vol:/app/media:ro
    depends_on:
      django:
        condition: service_healthy
    networks:
      - lugh_net
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout:  5s
      retries:  3
    ports:
      - "8090:80"

volumes:
  postgres_data:
  redis_data:
  static_vol:
  media_vol:

networks:
  lugh_net:
    driver: bridge
