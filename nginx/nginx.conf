upstream django_app {
    server django:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"         always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript;

    # ── Nginx-level health (no upstream needed) ───────────────────────────────
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Static files served directly by Nginx ────────────────────────────────
    location /static/ {
        alias   /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias   /app/media/;
        expires 7d;
        access_log off;
    }

    # ── SSE stream (long-lived — disable buffering, extend timeout) ───────────
    location ~* ^/realtime/.*/stream/ {
        proxy_pass         http://django_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE-specific: disable buffering so events reach the client immediately
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        chunked_transfer_encoding on;
    }

    # ── All other Django traffic ──────────────────────────────────────────────
    location / {
        proxy_pass         http://django_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
