# Docker's embedded DNS — re-resolve container hostnames every 10s instead
# of caching an IP for the life of the worker process. A static
# `upstream {}` block (what this replaced) resolves once at worker start
# and never again: after a host reboot, containers can come back with
# different internal IPs than before, and nginx kept retrying the OLD
# django IP forever ("connection refused") until manually reloaded. Using
# a variable in proxy_pass (set $django_upstream ...; below, per server
# block) is what actually forces nginx to honor this resolver — a static
# upstream block ignores it entirely. Costs the upstream keepalive pool,
# an irrelevant tradeoff at this traffic volume.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── Plain HTTP: LAN/local access, no TLS (Django issues its own https
#    redirect here when HTTPS_ENABLED=true, except for /nginx-health) ────────
server {
    listen 80;
    server_name _;
    set $django_upstream django:8000;
    include /etc/nginx/lugh-locations.conf;
}

# ── HTTPS: public entry point via lugh-apartments.duckdns.org ────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name lugh-apartments.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/lugh-apartments.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lugh-apartments.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    set $django_upstream django:8000;
    include /etc/nginx/lugh-locations.conf;
}
