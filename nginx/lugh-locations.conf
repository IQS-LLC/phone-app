client_max_body_size 20M;

# ── Security headers ──────────────────────────────────────────────────────
add_header X-Frame-Options "SAMEORIGIN"         always;
add_header X-Content-Type-Options "nosniff"     always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none';" always;

# ── Compression ───────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied    any;
gzip_types      text/plain text/css application/json application/javascript
                text/xml application/xml text/javascript;

# ── Nginx-level health (no upstream needed) ───────────────────────────────
location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}

# ── Static files served directly by Nginx ────────────────────────────────
location /static/ {
    alias   /app/staticfiles/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /media/ {
    alias   /app/media/;
    expires 7d;
    access_log off;
}

# ── Lugh web app (PWA) — Flutter web build, served statically ────────────
# Own CSP: the block above is Django-API-oriented (default-src 'none') and
# would silently block every script/wasm asset the Flutter build needs.
# add_header does not inherit once redeclared in a location, so the shared
# security headers are repeated here rather than lost for this path.
location /app/ {
    alias   /app/web_app/;
    try_files $uri $uri/ /app/index.html;
    add_header X-Frame-Options "SAMEORIGIN"         always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none';" always;
    expires 1h;
    access_log off;
}

# ── SSE stream (long-lived — disable buffering, extend timeout) ───────────
location ~* ^/realtime/.*/stream/ {
    proxy_pass         http://$django_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Hardcoded, not $scheme: real clients reach this server block over
    # HTTPS terminated upstream (Cloudflare Tunnel edge, or nginx's own
    # 443 block) even though the hop into nginx itself is plain HTTP —
    # $scheme here is always "http" and would make Django's
    # SECURE_SSL_REDIRECT 301-loop every real request.
    proxy_set_header   X-Forwarded-Proto https;
    # SSE-specific: disable buffering so events reach the client immediately
    proxy_buffering       off;
    proxy_cache           off;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    chunked_transfer_encoding on;
}

# ── All other Django traffic ──────────────────────────────────────────────
location / {
    proxy_pass         http://$django_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_connect_timeout  60s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
}
