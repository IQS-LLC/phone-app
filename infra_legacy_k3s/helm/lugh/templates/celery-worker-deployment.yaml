{{- if .Values.celeryWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "lugh.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celeryWorker.replicas }}
  selector:
    matchLabels:
      app: lugh-celery-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: lugh-celery-worker
        {{- include "lugh.labels" . | nindent 8 }}
        app.kubernetes.io/component: celery-worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.35
          command: ['sh', '-c',
            'until nc -z redis {{ .Values.redis.port }}; do echo "waiting for redis"; sleep 2; done']
        - name: wait-for-postgres
          image: busybox:1.35
          command: ['sh', '-c',
            'until nc -z postgres {{ .Values.postgres.port }}; do echo "waiting for postgres"; sleep 2; done']
      containers:
        - name: celery-worker
          image: {{ include "lugh.image" (merge (dict "repository" .Values.django.image.repository "tag" .Values.django.image.tag) .) }}
          imagePullPolicy: {{ .Values.django.image.pullPolicy }}
          command:
            - celery
            - -A
            - PLC_Project
            - worker
            - --loglevel=info
            - -Q
            - plc,alarms,notifications,housekeeping
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: lugh-config
            - secretRef:
                name: lugh-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lugh-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lugh-secrets
                  key: SECRET_KEY
          resources:
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - PLC_Project
                - inspect
                - ping
                - -d
                - celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
{{- end }}
