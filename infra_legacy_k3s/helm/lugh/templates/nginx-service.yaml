{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "lugh.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: NodePort
  selector:
    app: lugh-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: {{ .Values.nginx.nodePort }}
      name: http
    - port: 443
      targetPort: 443
      nodePort: {{ .Values.nginx.nodePortSSL }}
      name: https
{{- end }}
