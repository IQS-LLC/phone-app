# =============================================================================
# Lugh — Production stack (any Linux server or NAS)
#
# Image source: public Docker Hub — docker.io/<DOCKERHUB_USERNAME>/lugh-django
# No registry login needed to pull. CI pushes :latest on every main push.
#
# Required env vars (set in .env file next to this file):
#   DOCKERHUB_USERNAME=<your docker hub handle>
#   SECRET_KEY=<django secret key>
#   POSTGRES_PASSWORD=<db password>
#   PLC_ROUTE_USERNAME=<TwinCAT/CX embedded OS username, e.g. Administrator>
#   PLC_ROUTE_PASSWORD=<TwinCAT/CX embedded OS password>
#
# Optional env vars:
#   PLC_MODBUS_ENABLED=true       — TF6250 fallback, see modbus_bridge.md
#   PLC_OUTAGE_WEBHOOK_URL=<url>  — ntfy.sh/Slack/Discord outage alerts
#   HTTPS_ENABLED=true            — only once TLS actually terminates in front
#
# NAS first-time setup:
#   mkdir -p /volume1/docker/lugh/{postgres_data,redis_data,static,media,backups,web_app}
#   cp docker-compose.prod.yml /volume1/docker/lugh/
#   cat > /volume1/docker/lugh/.env <<'EOF'
#   DOCKERHUB_USERNAME=yourhandle
#   SECRET_KEY=<python3 -c "import secrets; print(secrets.token_urlsafe(50))">
#   POSTGRES_PASSWORD=<strong-password>
#   PLC_ROUTE_USERNAME=Administrator
#   PLC_ROUTE_PASSWORD=<CX embedded OS password>
#   EOF
#   chmod 600 /volume1/docker/lugh/.env
#   docker compose -f /volume1/docker/lugh/docker-compose.prod.yml up -d
# =============================================================================

x-django-env: &django-env
  env_file: /volume1/docker/lugh/.env
  environment:
    DJANGO_SETTINGS_MODULE: PLC_Project.settings
    DB_ENGINE:    django.db.backends.postgresql
    DB_NAME:      lugh_db
    DB_USER:      lugh_user
    DB_HOST:      db
    DB_PORT:      "5432"
    DB_PASSWORD:  ${POSTGRES_PASSWORD}
    REDIS_URL:    redis://redis:6379/0
    DEBUG:        "false"
    EXTRA_ALLOWED_HOSTS: ${EXTRA_ALLOWED_HOSTS:-192.168.0.192,192.168.0.158,localhost}
    PLC_MOCK:  ${PLC_MOCK:-false}
    PLC_IP:    ${PLC_IP:-192.168.0.161}
    PLC_NETID: ${PLC_NETID:-192.168.0.161.1.1}
    PLC_PORT:  ${PLC_PORT:-851}
    # This NAS's own AMS Net ID — must match the route registered on the CX
    # (TwinCAT System Manager Routes tab). Without it pyads defaults to an
    # unroutable local identity and real ADS connections fail on the target.
    # All six of these used to be hardcoded literals here instead of reading
    # from .env like everything else — meaning setting them in .env
    # silently had no effect. Found while deploying to a fresh VM: .env had
    # the right LOCAL_AMS_NET_ID, the running container had the placeholder
    # example value instead.
    LOCAL_AMS_NET_ID: ${LOCAL_AMS_NET_ID:-192.168.0.158.1.1}
    LOCAL_AMS_HOST:   ${LOCAL_AMS_HOST:-192.168.0.158}
    # Same credentials used to log into TwinCAT/the CX's embedded OS — lets
    # ADSClient auto-repair its AMS route on the target when TwinCAT resets
    # it (rebuild/reactivate/redownload clears dynamic routes). Without
    # both LOCAL_AMS_HOST above and these two, auto route-repair silently
    # no-ops — the single most common recurring failure mode this project
    # has hit, so don't deploy without setting PLC_ROUTE_USERNAME/PASSWORD
    # in .env.
    PLC_ROUTE_USERNAME: ${PLC_ROUTE_USERNAME}
    PLC_ROUTE_PASSWORD: ${PLC_ROUTE_PASSWORD}
    # Subnets to scan when the installer uses the Commissioning Wizard's
    # "Discover PLCs" step. Comma-separated CIDR notation.
    PLC_DISCOVERY_SUBNETS: ${PLC_DISCOVERY_SUBNETS:-192.168.0.0/24}
    WEB_CONCURRENCY: "1"
    # Modbus TCP fallback (TF6250) — see docs/plc_proposals/modbus_bridge.md.
    # Leave false until TF6250 is installed/licensed on the CX; defaults
    # off so this var is optional in .env.
    PLC_MODBUS_ENABLED: ${PLC_MODBUS_ENABLED:-false}
    # Optional: ntfy.sh/Slack/Discord webhook for outage alerts (see
    # check_plc_heartbeat in tasks.py). Empty = no-op.
    PLC_OUTAGE_WEBHOOK_URL: ${PLC_OUTAGE_WEBHOOK_URL:-}
    # Set true only once HTTPS actually terminates in front of this stack
    # (see settings.py's SECURE_PROXY_SSL_HEADER comment) — flips on HSTS/
    # secure-cookie/SSL-redirect. Leave false if serving plain HTTP.
    HTTPS_ENABLED: ${HTTPS_ENABLED:-false}

services:

  db:
    image: postgres:15-alpine
    container_name: lugh_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:   lugh_db
      POSTGRES_USER: lugh_user
    env_file: /volume1/docker/lugh/.env
    volumes:
      - /volume1/docker/lugh/postgres_data:/var/lib/postgresql/data
    networks:
      - lugh_net
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U lugh_user -d lugh_db"]
      interval: 10s
      timeout:  5s
      retries:  10

  redis:
    image: redis:7-alpine
    container_name: lugh_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - /volume1/docker/lugh/redis_data:/data
    networks:
      - lugh_net
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  3s
      retries:  10

  django:
    image: ${DOCKERHUB_USERNAME}/lugh-django:latest
    container_name: lugh_django
    restart: unless-stopped
    <<: *django-env
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear &&
        gunicorn --config gunicorn.conf.py PLC_Project.wsgi:application
      "
    volumes:
      - /volume1/docker/lugh/static:/app/staticfiles
      - /volume1/docker/lugh/media:/app/media
      - /volume1/docker/lugh/backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lugh_net
    healthcheck:
      test:     ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""]
      interval: 30s
      timeout:  10s
      start_period: 60s
      retries:  5

  celery-worker:
    image: ${DOCKERHUB_USERNAME}/lugh-django:latest
    container_name: lugh_celery_worker
    restart: unless-stopped
    <<: *django-env
    command: >
      celery -A PLC_Project worker
        --loglevel=info
        -Q plc,alarms,notifications,housekeeping
        --concurrency=4
    volumes:
      - /volume1/docker/lugh/backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lugh_net
    healthcheck:
      disable: true

  celery-beat:
    image: ${DOCKERHUB_USERNAME}/lugh-django:latest
    container_name: lugh_celery_beat
    restart: unless-stopped
    <<: *django-env
    command: >
      celery -A PLC_Project beat
        --loglevel=info
        --pidfile=/tmp/celerybeat.pid
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lugh_net
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.27-alpine
    container_name: lugh_nginx
    restart: unless-stopped
    volumes:
      - /volume1/docker/lugh/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /volume1/docker/lugh/nginx-locations.conf:/etc/nginx/lugh-locations.conf:ro
      - /volume1/docker/lugh/static:/app/staticfiles:ro
      - /volume1/docker/lugh/media:/app/media:ro
      - /volume1/docker/lugh/web_app:/app/web_app:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "9080:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
    networks:
      - lugh_net
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health 2>/dev/null || exit 1"]
      interval: 30s
      timeout:  5s
      retries:  3

networks:
  lugh_net:
    driver: bridge
    name: lugh_net
